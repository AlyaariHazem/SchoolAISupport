<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="500" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">API Endpoints Reference</text>

  <!-- ── CHAT ── -->
  <rect x="30" y="60" width="380" height="80" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="220" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">Chat</text>
  <!-- Method badge -->
  <rect x="48" y="92" width="46" height="18" rx="4" fill="#22c55e"/>
  <text x="71" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">POST</text>
  <text x="105" y="106" font-size="11" fill="#0c4a6e">/api/chat</text>
  <text x="48" y="128" font-size="10" fill="#0369a1">Body: message, userRole, conversationId?, userName?</text>
  <text x="48" y="143" font-size="10" fill="#0369a1">Returns: { conversationId, response }  · Roles: student | teacher | parent | admin</text>

  <!-- ── SUPPORT TICKETS ── -->
  <rect x="30" y="160" width="380" height="130" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="220" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Support Tickets</text>

  <!-- POST create ticket -->
  <rect x="48" y="192" width="46" height="18" rx="4" fill="#22c55e"/>
  <text x="71" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">POST</text>
  <text x="105" y="206" font-size="11" fill="#166534">/api/support/requests</text>
  <text x="48" y="222" font-size="10" fill="#374151">Body: issue, category, priority, userRole, userName</text>

  <!-- GET ticket by id -->
  <rect x="48" y="233" width="36" height="18" rx="4" fill="#3b82f6"/>
  <text x="66" y="247" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">GET</text>
  <text x="95" y="247" font-size="11" fill="#166534">/api/support/requests/{id}</text>
  <text x="48" y="264" font-size="10" fill="#374151">Returns single ticket or 404</text>

  <!-- GET admin tickets -->
  <rect x="48" y="274" width="36" height="18" rx="4" fill="#3b82f6"/>
  <text x="66" y="288" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">GET</text>
  <text x="95" y="288" font-size="11" fill="#166534">/api/admin/support-requests</text>
  <text x="48" y="305" font-size="10" fill="#374151">Header: X-User-Role: admin   · Returns all tickets (desc)</text>

  <!-- ── TOOLS ── -->
  <rect x="30" y="310" width="380" height="130" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="220" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">AI Tools</text>

  <!-- POST generate quiz -->
  <rect x="48" y="342" width="46" height="18" rx="4" fill="#22c55e"/>
  <text x="71" y="356" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">POST</text>
  <text x="105" y="356" font-size="11" fill="#92400e">/api/tools/generate-quiz</text>
  <text x="48" y="373" font-size="10" fill="#374151">Body: topic?, sourceText?, questionCount?</text>
  <text x="48" y="388" font-size="10" fill="#374151">Returns: quiz questions generated by Azure OpenAI</text>

  <!-- POST summarize -->
  <rect x="48" y="398" width="46" height="18" rx="4" fill="#22c55e"/>
  <text x="71" y="412" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">POST</text>
  <text x="105" y="412" font-size="11" fill="#92400e">/api/tools/summarize-document</text>
  <text x="48" y="429" font-size="10" fill="#374151">Body: text   · Returns: { summary }</text>
  <text x="48" y="444" font-size="10" fill="#374151">Summarizes school documents using Azure OpenAI</text>

  <!-- ── RIGHT COLUMN ── -->
  <!-- DevUI -->
  <rect x="450" y="60" width="380" height="80" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="640" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Developer UI</text>
  <rect x="468" y="92" width="36" height="18" rx="4" fill="#3b82f6"/>
  <text x="486" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">GET</text>
  <text x="515" y="106" font-size="11" fill="#4c1d95">/devui</text>
  <text x="468" y="128" font-size="10" fill="#5b21b6">Inspect agent traces and events during development</text>
  <text x="468" y="143" font-size="10" fill="#5b21b6">Disable in production environments</text>

  <!-- Common HTTP responses -->
  <rect x="450" y="160" width="380" height="130" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="640" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Common HTTP Responses</text>
  <text x="468" y="206" font-size="11" fill="#374151">✅  200 OK — successful GET or processed POST</text>
  <text x="468" y="224" font-size="11" fill="#374151">✅  201 Created — new support ticket</text>
  <text x="468" y="242" font-size="11" fill="#374151">⚠️  400 Bad Request — validation error (RFC 9457)</text>
  <text x="468" y="260" font-size="11" fill="#374151">🔒  403 Forbidden — admin endpoint without role header</text>
  <text x="468" y="278" font-size="11" fill="#374151">🔍  404 Not Found — ticket id not found</text>
  <text x="468" y="296" font-size="11" fill="#374151">⚡  499 Client Closed — request cancelled mid-flight</text>
  <text x="468" y="314" font-size="11" fill="#374151">💥  502 Bad Gateway — Azure OpenAI unreachable</text>

  <!-- Content-Type note -->
  <rect x="450" y="310" width="380" height="60" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="640" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">All POST requests</text>
  <text x="468" y="352" font-size="11" fill="#374151">Content-Type: application/json</text>
  <text x="468" y="370" font-size="11" fill="#374151">All enums are camelCase strings (e.g. "student", "high")</text>

  <!-- Base URL note -->
  <rect x="450" y="390" width="380" height="50" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Base URL (local dev)</text>
  <text x="640" y="432" text-anchor="middle" font-size="11" fill="#64748b">http://localhost:5043  (see launchSettings.json)</text>

  <!-- Separator -->
  <line x1="430" y1="60" x2="430" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Footer -->
  <rect x="30" y="458" width="800" height="30" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="430" y="477" text-anchor="middle" font-size="10" fill="#64748b">Full examples in  src/WebApi/WebApi.http  — open with any IDE REST client (VS / Rider / VS Code REST Client)</text>
</svg>
