<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">School AI Support — System Architecture</text>

  <!-- ── CLIENTS ── -->
  <rect x="30" y="70" width="150" height="400" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="105" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">Clients</text>

  <!-- Student -->
  <rect x="48" y="106" width="114" height="46" rx="8" fill="#fff" stroke="#38bdf8" stroke-width="1"/>
  <text x="105" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">🎓 Student</text>
  <text x="105" y="143" text-anchor="middle" font-size="10" fill="#64748b">Arabic / English</text>

  <!-- Teacher -->
  <rect x="48" y="162" width="114" height="46" rx="8" fill="#fff" stroke="#38bdf8" stroke-width="1"/>
  <text x="105" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">👩‍🏫 Teacher</text>
  <text x="105" y="199" text-anchor="middle" font-size="10" fill="#64748b">Quiz · Summarize</text>

  <!-- Parent -->
  <rect x="48" y="218" width="114" height="46" rx="8" fill="#fff" stroke="#38bdf8" stroke-width="1"/>
  <text x="105" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">👨‍👩‍👧 Parent</text>
  <text x="105" y="255" text-anchor="middle" font-size="10" fill="#64748b">Questions · Tickets</text>

  <!-- Admin -->
  <rect x="48" y="274" width="114" height="46" rx="8" fill="#fff" stroke="#38bdf8" stroke-width="1"/>
  <text x="105" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">🔐 Admin</text>
  <text x="105" y="311" text-anchor="middle" font-size="10" fill="#64748b">Tickets · Reports</text>

  <!-- REST Client / IDE -->
  <rect x="48" y="330" width="114" height="46" rx="8" fill="#fff" stroke="#38bdf8" stroke-width="1"/>
  <text x="105" y="348" text-anchor="middle" font-size="11" font-weight="600" fill="#0369a1">🖥 REST Client</text>
  <text x="105" y="367" text-anchor="middle" font-size="10" fill="#64748b">.http / curl / Postman</text>

  <!-- Arrows from clients -->
  <line x1="180" y1="270" x2="265" y2="270" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="263" text-anchor="middle" font-size="9" fill="#64748b">HTTP/REST</text>

  <!-- ── WEB API ── -->
  <rect x="265" y="70" width="300" height="400" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="415" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">ASP.NET Core WebApi</text>

  <!-- Endpoints box -->
  <rect x="280" y="104" width="270" height="100" rx="8" fill="#fff" stroke="#4ade80" stroke-width="1"/>
  <text x="415" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Minimal API Endpoints</text>
  <text x="415" y="140" text-anchor="middle" font-size="10" fill="#374151">POST /api/chat</text>
  <text x="415" y="155" text-anchor="middle" font-size="10" fill="#374151">POST /api/support/requests</text>
  <text x="415" y="170" text-anchor="middle" font-size="10" fill="#374151">GET  /api/support/requests/{id}</text>
  <text x="415" y="185" text-anchor="middle" font-size="10" fill="#374151">GET  /api/admin/support-requests</text>
  <text x="415" y="200" text-anchor="middle" font-size="10" fill="#374151">POST /api/tools/generate-quiz · summarize-document</text>

  <!-- Services box -->
  <rect x="280" y="215" width="270" height="175" rx="8" fill="#fff" stroke="#4ade80" stroke-width="1"/>
  <text x="415" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Core Services</text>
  <text x="295" y="253" font-size="10" fill="#374151">• AgentService</text>
  <text x="295" y="271" font-size="10" fill="#374151">• PromptBuilderService</text>
  <text x="295" y="289" font-size="10" fill="#374151">• ConversationMemoryService</text>
  <text x="295" y="307" font-size="10" fill="#374151">• SchoolKnowledgeService</text>
  <text x="295" y="325" font-size="10" fill="#374151">• SupportRequestService / SupportTicketStore</text>
  <text x="295" y="343" font-size="10" fill="#374151">• QuizGenerationService</text>
  <text x="295" y="361" font-size="10" fill="#374151">• SchoolDocumentSummarizationService</text>

  <!-- KnowledgeBase -->
  <rect x="280" y="400" width="270" height="52" rx="8" fill="#fff" stroke="#4ade80" stroke-width="1"/>
  <text x="415" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">KnowledgeBase/</text>
  <text x="415" y="440" text-anchor="middle" font-size="10" fill="#374151">.txt and .md files — keyword search at startup</text>

  <!-- Arrow WebApi → Azure OpenAI -->
  <line x1="565" y1="270" x2="650" y2="270" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="607" y="263" text-anchor="middle" font-size="9" fill="#64748b">IChatClient</text>

  <!-- ── AZURE OPENAI ── -->
  <rect x="650" y="150" width="210" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="755" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Azure OpenAI</text>
  <text x="755" y="195" text-anchor="middle" font-size="11" fill="#78350f">Chat Completion</text>
  <text x="755" y="213" text-anchor="middle" font-size="10" fill="#92400e">gpt-4o-mini / custom</text>
  <text x="755" y="233" text-anchor="middle" font-size="10" fill="#92400e">AzureCliCredential</text>
  <text x="755" y="251" text-anchor="middle" font-size="10" fill="#92400e">(managed identity in prod)</text>

  <!-- ── ASPIRE + DEVUI ── -->
  <rect x="650" y="300" width="210" height="90" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="755" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Observability</text>
  <text x="755" y="343" text-anchor="middle" font-size="10" fill="#5b21b6">OpenTelemetry traces &amp; metrics</text>
  <text x="755" y="360" text-anchor="middle" font-size="10" fill="#5b21b6">DevUI  /devui</text>
  <text x="755" y="377" text-anchor="middle" font-size="10" fill="#5b21b6">.NET Aspire Dashboard (optional)</text>

  <!-- Arrow WebApi → Observability -->
  <line x1="565" y1="350" x2="650" y2="350" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>

  <!-- AppHost label -->
  <rect x="650" y="420" width="210" height="60" rx="10" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>
  <text x="755" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">AppHost (Aspire)</text>
  <text x="755" y="463" text-anchor="middle" font-size="10" fill="#9d174d">Optional orchestration</text>
  <text x="755" y="478" text-anchor="middle" font-size="10" fill="#9d174d">Multi-service dashboard</text>

  <!-- Arrow dashed AppHost → WebApi -->
  <line x1="650" y1="450" x2="565" y2="420" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPink)"/>

  <!-- Legend -->
  <rect x="30" y="500" width="840" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="50" y1="520" x2="80" y2="520" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="90" y="524" font-size="10" fill="#374151">Synchronous call</text>
  <line x1="200" y1="520" x2="230" y2="520" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="240" y="524" font-size="10" fill="#374151">Telemetry / optional</text>
  <line x1="380" y1="520" x2="410" y2="520" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPink)"/>
  <text x="420" y="524" font-size="10" fill="#374151">Aspire orchestration (optional)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f472b6"/>
    </marker>
  </defs>
</svg>
